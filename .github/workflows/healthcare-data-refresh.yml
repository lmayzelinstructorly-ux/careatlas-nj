name: Healthcare data refresh

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: healthcare-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh healthcare data from official sources
        run: npm run refresh:healthcare-data

      - name: Build
        run: npm run build

      - name: Commit and push refreshed data
        run: |
          git config user.name "careatlas-data-refresh[bot]"
          git config user.email "careatlas-data-refresh@users.noreply.github.com"
          git add public/data scripts docs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: automated healthcare data refresh ($(date -u +%F))"
          git push origin main
